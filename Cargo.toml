[package]
name = "fltk-kit"
version = "0.1.0"
edition = "2021"
description = "Common utilities for fltk-rs applications"
license = "MIT OR Apache-2.0"
repository = "https://github.com/yourname/fltk-kit"
readme = "README.md"
keywords = ["fltk", "gui", "utility"]
categories = ["gui"]

[dependencies]
fltk = "1.5.23"
fltk-table = "0.3.5"
base64 = "0.23.1"
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg", "bmp", "gif"] }
ndarray = "0.17.2"