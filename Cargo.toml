[package]
name = "fltk-kit"
version = "0.6.2"
edition = "2021"
description = "Reusable, high-level utilities and boilerplate reducers for fltk-rs applications."
license = "MIT OR Apache-2.0"
repository = "https://github.com/huanghu578/fltk-kit"
homepage = "https://github.com/huanghu578/fltk-kit"
documentation = "https://docs.rs/fltk-kit"
readme = "README.md"
keywords = ["fltk", "gui", "desktop", "layout", "async"]
categories = ["gui", "development-tools"]

[dependencies]
fltk = "1.5.23"
fltk-table = "0.1"
serde = { version = "1.0", features = ["derive"] }
toml = "0.8"
base64 = "0.22"
ndarray = "0.17.2"
once_cell = "1.21.4"
sys-locale = "0.3.2"


[build-dependencies]
winres = "0.1"

[features]
default = []
