[package]
name = "fltk-kit"
version = "0.4.0"
edition = "2021"
description = "Reusable, high-level utilities and boilerplate reducers for fltk-rs applications."
license = "MIT OR Apache-2.0"

[dependencies]
fltk = "1.5.23"
fltk-table = "0.1"
serde = { version = "1.0", features = ["derive"] }
toml = "0.8"
base64 = "0.22"
ndarray = "0.17.2"
once_cell = "1.21.4"

[build-dependencies]
winres = "0.1"

[features]
default = []
# Windows 托盘需要额外的依赖，但考虑到极简，我们这里不引入托盘，仅支持 exe 和窗口图标